# Configuración principal. Todo lo sensible viene de variables de entorno (ver .env.example).
spring:
  application:
    name: pey_backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pey_backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

# Integración con Pey (https://docs.pey.mx)
pey:
  api-key: ${PEY_API_KEY:}
  api-url: ${PEY_API_URL:https://api.pey.mx}
  # Vigencia del QR en segundos; Pey exige minimo 360 (si es menor la app no arranca)
  qr-expiration-seconds: ${QR_EXPIRATION_SECONDS:1200}
  # Si es true, Pey regresa qrImage (PNG base64); es mas lento. Por defecto el front dibuja el QR desde qrString
  generate-image: ${PEY_GENERATE_IMAGE:false}
  # Timeouts del PeyClient en milisegundos
  connect-timeout-ms: ${PEY_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${PEY_READ_TIMEOUT_MS:30000}

# Tarea programada que marca EXPIRED las aportaciones PENDING vencidas
webhook:
  expiration-job:
    delay-ms: ${WEBHOOK_EXPIRATION_JOB_DELAY_MS:60000}
    initial-delay-ms: ${WEBHOOK_EXPIRATION_JOB_INITIAL_DELAY_MS:60000}

app:
  jwt:
    # Obligatorio: minimo 32 bytes (de preferencia Base64). Sin el la app no arranca
    secret: ${JWT_SECRET:}
    # Milisegundos (por defecto 1 hora)
    expiration: ${JWT_EXPIRATION:3600000}
  # Admin inicial: se crea al arrancar solo si no existe y si ADMIN_PASSWORD no esta vacio
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Orígenes permitidos separados por comas
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
