# Configuración principal. Todo lo sensible viene de variables de entorno (ver .env.example).
spring:
  application:
    name: pey_backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pey_backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

# Integración con Pey (https://docs.pey.mx)
pey:
  api-key: ${PEY_API_KEY:}
  api-url: ${PEY_API_URL:https://api.pey.mx}
  qr-expiration-seconds: ${QR_EXPIRATION_SECONDS:1200}

app:
  jwt:
    secret: ${JWT_SECRET:}
    # Milisegundos (por defecto 1 hora)
    expiration: ${JWT_EXPIRATION:3600000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Orígenes permitidos separados por comas
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
