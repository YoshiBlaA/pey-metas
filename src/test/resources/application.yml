# Configuración de pruebas: H2 en memoria, sin MySQL ni secretos reales.
spring:
  datasource:
    url: jdbc:h2:mem:pey_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

pey:
  api-key: test-api-key
  api-url: http://localhost:9999
  qr-expiration-seconds: 1200

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtc29sby1wYXJhLXBydWViYXMtMzItYnl0ZXMtbWluaW1vLTEyMzQ1Njc4OTA=
    expiration: 3600000
  admin:
    username: admin
    password: admin-test
  cors:
    origins: http://localhost:3000
